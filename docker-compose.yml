services:
  mysql:
    image: mysql:8.4
    container_name: limpafacil-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: limpafacil
      MYSQL_USER: limpafacil_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - limpafacil_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  limpafacil_mysql:
